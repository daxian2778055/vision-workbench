# VisionFlowPlatform CI：构建 + 跑测（调用 tools/ci.ps1）
#
# 为什么必须用「自托管 runner」：
#   本项目依赖 Qt 6.11 + HALCON（商业授权）+ 海康 MVS SDK + thirdparty（OpenCV/ZXing/Tesseract），
#   这些无法在 GitHub 托管 runner 上安装；且测试需要 dist/VisionFlowPlatform 提供运行时 DLL。
#
# runner 前置条件（在自托管机器上准备一次）：
#   1. Visual Studio 2022（含 C++ 桌面开发工具链）与 CMake；
#   2. Qt 6.11，且 find_package(Qt6) 可发现（建议设置 CMAKE_PREFIX_PATH，
#      例如 C:\Qt\6.11.0\msvc2022_64）；
#   3. HALCON：设置环境变量 HALCONROOT，或安装在 CMakeLists 的默认路径；
#   4. 仓库内 thirdparty/（OpenCV/ZXing/Tesseract）与 dist/VisionFlowPlatform（运行时 DLL）已就绪；
#      thirdparty/ 与 dist/ 在 .gitignore 中，不会随 checkout 出现。两种方式二选一：
#        a) 把它们直接放到 runner 工作区（需自行保证每次 checkout 后仍存在），或
#        b) 保持本机某个目录（默认 E:/halcon/2/xin1）存放它们，由下方"准备本地资源"步骤
#           创建目录联接（junction，只读使用、不复制）；可用环境变量 VFP_ASSETS_ROOT 覆盖该目录。
#   5. 安装 actions/runner 并以标签 [self-hosted, windows] 注册；
#      版本需 ≥ 2.327.1——actions/checkout@v5 以 Node 24 运行，旧 runner 会拒绝；
#   6. PowerShell 7（pwsh）——本工作流的步骤使用 shell: pwsh。请安装 MSI 版
#      （choco install powershell-core，装到 C:\Program Files\PowerShell\7）。
#      勿用 Store/MSIX 版：其 %LOCALAPPDATA%\Microsoft\WindowsApps\pwsh.EXE 只是个
#      应用执行别名存根，在 runner 的启动上下文里会报「找不到适用的应用许可证」，
#      导致每个 shell 步骤直接失败。tools/run-runner.ps1 会把 MSI 目录前置以规避。
#   7. PATH 中不得存在「无法枚举」的目录，例如卸载残留的断链 junction 或已被删除的目录。
#      runner 通过 WhichUtil.Which("pwsh") 逐个枚举 PATH 查找 shell，遇到这类条目会以
#      System.IO.DirectoryNotFoundException 中断**每一个** run: 步骤（表现为步骤秒失败、
#      且不产生 ci-*.log）。可用 tools/run-runner.ps1 启动监听，它会在启动前清洗 PATH。
#
# 安全边界（自托管 runner 的信任模型，务必不要放宽）：
#   本工作流运行在本机自托管 runner 上，而工作区里的构建脚本（tools/ci.ps1、CMakeLists、
#   以及本工作流自身）都会被该 runner 执行。也就是说：**谁能让本工作流跑起来，谁就能在
#   这台机器上以 runner 账户执行任意命令**。因此：
#     - 只接受 main 的 push、手动触发，以及「同仓库分支」发起的 PR；
#     - 外部 fork 的 PR 一律跳过（见 jobs.build-and-test.if）——公开仓库无法排除恶意提交，
#       即使 GitHub 对首次贡献者要求人工批准，批准过一次之后该账号的后续 PR 就会自动运行；
#     - 需要验证外部贡献时：把改动拉进本仓库分支再开 PR，或在受控机器上人工执行 tools/ci.ps1；
#     - 不要给本工作流添加 pull_request_target / workflow_run 之类的提权触发方式；
#     - 本仓库要求 action 钉到完整 commit SHA，故 uses 只能写 SHA（见「拉取代码」步骤注释）。
#
# 若暂时没有自托管 runner，可直接在本机执行同一脚本：
#   powershell -ExecutionPolicy Bypass -File tools/ci.ps1

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # 信任边界：跳过外部 fork 的 PR（详见文件头「安全边界」）。
    # 同仓库分支的 PR、main 的 push、手动触发照常运行。
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    # 需自托管 Windows runner（见文件头说明）
    runs-on: [self-hosted, windows]
    timeout-minutes: 90

    steps:
      - name: 拉取代码
        # 本仓库启用了「action 必须钉到完整 commit SHA」（Settings → Actions → General），
        # 所以这里必须写 SHA、不能写 @v5，否则任务在 Job initialize 阶段就被拒绝
        # （UnresolvableActionDownloadInfoException）。升级时用
        #   git ls-remote https://github.com/actions/checkout 'refs/tags/v5*'
        # 查新 SHA 并同步更新注释。
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5.1.0
        with:
          # 保留工作区内的未跟踪文件（尤其是 CMake 的 build/ 目录），让自托管 runner 能增量构建。
          # 默认的 clean: true 会执行 git clean -ffdx，把 build/ 一并清掉，导致每次推送都全量重建。
          clean: false

      - name: 准备本地资源（thirdparty/dist 不在版本库中）
        shell: pwsh
        run: |
          # thirdparty/（OpenCV/ZXing/Tesseract 的头文件与库）与 dist/VisionFlowPlatform（运行时 DLL）
          # 都在 .gitignore 中，不会随 checkout 出现；这里用目录联接指向本机资源目录（只读，不复制）。
          # 注：checkout 的 git clean 只会删除联接本身，不会影响目标目录内容。
          $assets = if ($env:VFP_ASSETS_ROOT) { $env:VFP_ASSETS_ROOT } else { 'E:/halcon/2/xin1' }
          foreach ($name in @('thirdparty', 'dist')) {
            if (Test-Path $name) { Write-Host "[skip] $name 已存在"; continue }
            $target = Join-Path $assets $name
            if (-not (Test-Path $target)) {
              throw "缺少资源目录 $target；请把 thirdparty/ 与 dist/ 放入仓库根，或设置环境变量 VFP_ASSETS_ROOT 指向包含它们的目录"
            }
            New-Item -ItemType Junction -Path $name -Target $target | Out-Null
            Write-Host "[link] $name -> $target"
          }

      - name: 构建并运行全部测试
        shell: pwsh
        run: ./tools/ci.ps1 -Config Release
        # 脚本退出码：0=通过 / 1=构建失败 / 2=测试失败 / 3=环境缺失；
        # 任一非 0 都会让本步骤失败，从而拦住回归。

      - name: 失败时输出构建日志尾部
        if: failure()
        shell: pwsh
        run: |
          foreach ($f in @('ci-build.log', 'ci-test.log', 'ci-configure.log')) {
            if (Test-Path $f) {
              Write-Host "===== $f (tail) ====="
              Get-Content $f -Tail 60
            }
          }
