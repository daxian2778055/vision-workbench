# VisionFlowPlatform CI/CD 配置
# GitHub Actions 工作流

name: VisionFlowPlatform CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # 静态分析作业
  static-analysis:
    name: Static Analysis
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v1
    
    - name: Install cppcheck
      run: |
        choco install cppcheck -y
    
    - name: Install LLVM
      run: |
        choco install llvm -y
    
    - name: Generate compile_commands.json
      run: |
        cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_BUILD_TYPE=Debug
    
    - name: Run cppcheck
      run: |
        cppcheck --enable=all --suppress=missingInclude --suppress=unusedFunction --error-exitcode=1 src/ include/
    
    - name: Run clang-tidy
      run: |
        clang-tidy -p build src/*.cpp --header-filter=include/.*\.h$
    
    - name: Upload cppcheck report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: cppcheck-report
        path: cppcheck-results.xml
    
    - name: Upload clang-tidy report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: clang-tidy-report
        path: clang-tidy-results.txt

  # 代码质量检查作业
  code-quality:
    name: Code Quality
    runs-on: windows-latest
    needs: static-analysis
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install code quality tools
      run: |
        pip install lizard cpd
    
    - name: Run complexity analysis
      run: |
        lizard src/*.cpp > complexity-report.txt
    
    - name: Run duplicate code detection
      run: |
        cpd --minimum-tokens 50 --language cpp --dir src/ > duplicate-report.txt
    
    - name: Upload quality reports
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: quality-reports
        path: |
          complexity-report.txt
          duplicate-report.txt

  # 构建作业
  build:
    name: Build
    runs-on: windows-latest
    needs: static-analysis
    
    strategy:
      matrix:
        build_type: [Debug, Release]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v1
    
    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.10.0'
        arch: win64_msvc2019_64
    
    - name: Setup HALCON
      run: |
        # 设置 HALCON 环境变量
        echo "HALCON_ROOT=D:/Program Files/MVTec/HALCON-24.11-Progress-Steady" >> $GITHUB_ENV
        echo "HALCONARCH=x64-win64" >> $GITHUB_ENV
    
    - name: Setup OpenCV
      run: |
        # 设置 OpenCV 环境变量
        echo "OpenCV_DIR=${{ github.workspace }}/thirdparty/opencv/build" >> $GITHUB_ENV
    
    - name: Generate compile_commands.json
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
    
    - name: Build project
      run: |
        cmake --build build --config ${{ matrix.build_type }} --parallel
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      if: matrix.build_type == 'Release'
      with:
        name: build-artifacts
        path: |
          build/bin/*.exe
          build/bin/*.dll

  # 测试作业
  test:
    name: Test
    runs-on: windows-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: build-artifacts
        path: build/bin
    
    - name: Run unit tests
      run: |
        cd build
        ctest --output-on-failure -C Release
    
    - name: Run integration tests
      run: |
        # 运行集成测试
        .\build\bin\VisionFlowPlatform.exe --test
    
    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results
        path: |
          build/Testing/
          test-results.xml

  # 代码覆盖率作业
  coverage:
    name: Code Coverage
    runs-on: windows-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v1
    
    - name: Install coverage tools
      run: |
        choco install opencppcoverage -y
    
    - name: Generate compile_commands.json
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="--coverage"
    
    - name: Build with coverage
      run: |
        cmake --build build --config Debug --parallel
    
    - name: Run tests with coverage
      run: |
        OpenCppCoverage --sources src -- build/bin/Release/VisionFlowPlatform.exe --test
    
    - name: Generate coverage report
      run: |
        OpenCppCoverage --sources src --export_type=cobertura:coverage.xml -- build/bin/Release/VisionFlowPlatform.exe --test
    
    - name: Upload coverage report
      uses: codecov/codecov-action@v3
      with:
        files: coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  # 安全扫描作业
  security-scan:
    name: Security Scan
    runs-on: windows-latest
    needs: static-analysis
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Run security scan
      uses: github/codeql-action/init@v2
      with:
        languages: cpp
    
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2

  # 性能测试作业
  performance-test:
    name: Performance Test
    runs-on: windows-latest
    needs: build
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: build-artifacts
        path: build/bin
    
    - name: Run performance tests
      run: |
        .\build\bin\VisionFlowPlatform.exe --performance-test
    
    - name: Upload performance results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: performance-results
        path: performance-results.json

  # 部署作业
  deploy:
    name: Deploy
    runs-on: windows-latest
    needs: [build, test, coverage, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Download build artifacts
      uses: actions/download-artifact@v3
      with:
        name: build-artifacts
        path: build/bin
    
    - name: Create deployment package
      run: |
        # 创建部署包
        mkdir deploy
        copy build/bin/*.exe deploy/
        copy build/bin/*.dll deploy/
        copy docs deploy/docs/
        copy tools deploy/tools/
    
    - name: Upload deployment package
      uses: actions/upload-artifact@v3
      with:
        name: deployment-package
        path: deploy/

  # 通知作业
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [static-analysis, code-quality, build, test, coverage, security-scan, performance-test]
    if: always()
    
    steps:
    - name: Send Slack notification
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#ci-cd'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      if: always()
    
    - name: Send email notification
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        username: ${{ secrets.EMAIL_USERNAME }}
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "CI/CD Report: ${{ github.repository }}"
        body: |
          Build Status: ${{ job.status }}
          Repository: ${{ github.repository }}
          Branch: ${{ github.ref }}
          Commit: ${{ github.sha }}
          Author: ${{ github.actor }}
        to: team@example.com
        from: ci@example.com
      if: failure()
